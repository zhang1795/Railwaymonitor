spring.datasource.url=jdbc:h2:mem:p0;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:base-schema.sql,classpath:db/p0-migration.sql,classpath:db/frontend-notices-migration.sql,classpath:db/p1-alarm-migration.sql,classpath:db/p1-stability-migration.sql,classpath:db/p1-visualization-migration.sql,classpath:db/risk-template-migration.sql,classpath:test-stability-indexes.sql
railway.mqtt.enabled=false
railway.preview-service-key=isolated-test-service-key-32-characters-long
railway.allow-legacy-md5-login=true
server.servlet.session.cookie.secure=false
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
logging.level.com.example=warn
logging.level.root=warn

railway.evidence-service-key=isolated-evidence-service-key-at-least-32-characters
railway.notify.scheduled=false
railway.recording-maintenance-ms=86400000
railway.health-sampling=false
railway.notify.webhook-url=
railway.notify.webhook-key=
railway.notify.sms-access-key=
railway.notify.sms-secret=
railway.notify.sms-sign=
railway.notify.sms-template=
railway.notify.sms-recipients=
