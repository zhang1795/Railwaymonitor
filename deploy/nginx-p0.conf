# Supply real certificate paths and server_name before use.
server {
    listen 443 ssl;
    server_name your-server-name;
    ssl_certificate /etc/railway/tls/server.crt;
    ssl_certificate_key /etc/railway/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/railway/web-vue/dist;
    location / { try_files $uri $uri/ /index.html; }
    location /api/_internal/ { return 404; }
    # Configure a separate trusted HTTPS worker ingress for remote evidence uploads.
    location /api/_evidence/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /stream/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # Authorization travels in the first WS frame, not a query string.
    }
}
