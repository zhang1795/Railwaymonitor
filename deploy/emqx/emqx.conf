node {
  name = "emqx@127.0.0.1"
  # Required by the early config parser; deployment MUST override this using
  # EMQX_NODE__COOKIE. compose.yaml requires a generated secret for that field.
  cookie = "MUST_BE_OVERRIDDEN_BY_EMQX_NODE__COOKIE"
  data_dir = "/opt/emqx/data"
}
dashboard.listeners.http.bind = 18083
authentication = [{
  mechanism = password_based
  backend = built_in_database
  user_id_type = username
  password_hash_algorithm { name = sha256, salt_position = suffix }
}]
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [{ type = file, path = "/opt/emqx/etc/railway-acl.conf" }]
}
mqtt { use_username_as_clientid = true, max_packet_size = 32KB }
listeners.ws.default.enable = false
listeners.wss.default.enable = false
listeners.ssl.default.enable = false
